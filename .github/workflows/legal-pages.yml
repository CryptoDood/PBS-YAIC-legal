name: Publish legal pages

# Publishes only legal-site/ (public legal material: Privacy Policy, Terms
# of Service, and an index linking them) to GitHub Pages. $0 incremental
# spend (GitHub Pages is free for a repository that already has it
# enabled), no secrets, no private architecture, no customer data, no
# internal assurance evidence, no production credentials, no personal
# information — Founder decision, 2026-10-05 ("legal-page publishing"),
# approved this narrow scope on those exact conditions.
#
# This workflow alone does not make anything public: GitHub Pages must
# still be enabled for this repository (Settings -> Pages -> Build and
# deployment -> Source: GitHub Actions) before this workflow's deploy step
# can publish anything. That one-time repository-settings change is
# outside what this workflow (or any tool available to the session that
# authored it) can do on its own — it needs a repository owner/admin.
# Until it's enabled, this workflow's build job still runs on every push
# (so the output is always validated), but the deploy job is a no-op.

on:
  push:
    branches: [main, master]
    paths:
      - "legal-site/**"
      - ".github/workflows/legal-pages.yml"
      - ".github/scripts/stage-legal-site.sh"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only allow-listed, validated files from legal-site/
        # #442/#443 (qa/defect-ledger.md): this step used to call
        # scripts/stage-legal-site.sh, which the public repo never received
        # (ENOENT, #442) — then, in a rejected fix attempt, inlined a
        # hand-copied duplicate of that script's logic directly here, with a
        # self-test that claimed but never actually proved the duplicate
        # matched the original (#443). There is now exactly one copy of this
        # logic: scripts/publish-legal-site.sh ships the real
        # scripts/stage-legal-site.sh to .github/scripts/ in this repo (a
        # path GitHub Pages never serves — Pages only ever gets what this
        # step copies OUT of legal-site/ below), so this step can call the
        # genuine file directly. See
        # scripts/stage-legal-pages-publish-bundle.sh for what else gets
        # shipped alongside legal-site/ and why.
        run: .github/scripts/stage-legal-site.sh legal-site "$RUNNER_TEMP/legal-site-stage"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/legal-site-stage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
